<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Prototype Landing Page — Prof. Dr. Ir. Lukman Setiawan</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f2f4f9;--bar:#fff;--ink:#0b1f4d;--mut:#5a6683;--red:#c8102e;--blue:#0a3d91;--line:#d9deea}
@media(prefers-color-scheme:dark){:root{--bg:#050a1c;--bar:#0a1330;--ink:#eef2ff;--mut:#9aa7c7;--red:#ff5a70;--blue:#7aa8ff;--line:#22305c}}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
.bar{background:var(--bar);border-bottom:3px solid var(--red);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.tt{font-weight:700;line-height:1.2}.tt small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.dv button{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:8px}
.tabs button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.tabs button b{color:var(--red);margin-right:4px}.tabs button[aria-pressed=true] b{color:#fff}
.dv{display:flex;gap:6px;align-items:center}.dv button[aria-pressed=true]{border-color:var(--red);color:var(--red);font-weight:600}
.dv a{color:var(--blue);text-decoration:none;font-weight:600;margin-left:6px}
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:14px;overflow:auto}
.frame{width:100%;height:100%;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(11,31,77,.15);transition:width .25s ease}
.frame iframe{width:100%;height:100%;border:0;display:block}
.stage[data-d=tablet] .frame{width:768px;max-width:100%}.stage[data-d=mobile] .frame{width:390px;max-width:100%}
.nm{font-size:13px;color:var(--mut);padding:0 16px 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:700px){.dv span,.stage{padding:8px}.dv{display:none}.stage{padding:0}.frame{border-radius:0;border:0}.nm{padding:6px 12px}}
</style></head><body>
<div class="bar"><div class="tt">Prof. Dr. Ir. Lukman Setiawan<small>Prototype landing page · pilih salah satu</small></div>
<div class="tabs" role="tablist"><button data-k="a"><b>A</b>Editorial</button><button data-k="b"><b>B</b>Swiss</button><button data-k="c"><b>C</b>Navy</button></div>
<div class="dv"><button data-d="desktop">Desktop</button><button data-d="tablet">Tablet</button><button data-d="mobile">HP</button><a id="open" href="a.html" target="_blank" rel="noopener">Layar penuh ↗</a></div></div>
<div class="nm"><span id="ds"></span><span>Gunakan tombol ← → untuk berpindah pilihan</span></div>
<div class="stage" id="st" data-d="desktop"><div class="frame"><iframe id="fr" title="Pratinjau landing page" src="a.html"></iframe></div></div>
<script>
var N={a:"A · Editorial Akademik: serif elegan, nuansa jurnal ilmiah.",b:"B · Swiss Grid: blok warna tegas, tipografi tebal, paling berani.",c:"C · Navy Institusional: resmi, hero biru tua dengan timeline."},K=["a","b","c"],cur="a";
function show(k,s){if(!N[k])k="a";cur=k;document.getElementById("fr").src=k+".html";document.getElementById("open").href=k+".html";document.getElementById("ds").textContent=N[k];
document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.k===k)});
if(!s){try{history.replaceState(null,"","#"+k)}catch(e){}}}
function dev(d){document.getElementById("st").dataset.d=d;document.querySelectorAll(".dv button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.d===d)})}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){show(b.dataset.k)}});
document.querySelectorAll(".dv button").forEach(function(b){b.onclick=function(){dev(b.dataset.d)}});
document.addEventListener("keydown",function(e){var i=K.indexOf(cur);if(e.key==="ArrowRight")show(K[(i+1)%3]);if(e.key==="ArrowLeft")show(K[(i+2)%3])});
addEventListener("hashchange",function(){show(location.hash.slice(1),true)});
dev("desktop");show(location.hash.slice(1)||"a",true);
</script></body></html>
